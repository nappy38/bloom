<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Bloom</title>
<meta name="theme-color" content="#c98a5a">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Cormorant+Garamond:ital@1&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f4efe4; --bg2:#ede3d2; --card:#fdfaf3; --ink:#4a3a37; --sub:#a3877f;
  --line:#eaded0; --rose:#cf8f8a; --rose-d:#b3716c; --gold:#c9974f; --gold-d:#a8783a;
  --shadow:0 10px 30px rgba(150,100,90,.14);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:"Zen Maru Gothic",system-ui,sans-serif;
  background:linear-gradient(180deg,var(--bg),var(--bg2));
  color:var(--ink);
  display:flex; justify-content:center; align-items:flex-start;
  -webkit-tap-highlight-color:transparent;
}
#app{
  width:100%; max-width:460px; min-height:100dvh;
  display:none; flex-direction:column; position:relative;
}
#app.show{ display:flex; }

/* ===== 合言葉ゲート ===== */
#gate{
  width:100%; max-width:460px; min-height:100dvh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:18px; padding:24px; text-align:center;
}
#gate.hide{ display:none; }
#gate .icon{ font-size:34px; }
#gate .gtitle{ font-weight:700; font-size:15px; }
#gate .gsub{ font-size:11.5px; color:var(--sub); line-height:1.7; }
#gateForm{ display:flex; flex-direction:column; align-items:center; gap:10px; width:100%; max-width:240px; }
#gateInput{
  width:100%; text-align:center; font-size:16px; letter-spacing:.15em;
  padding:12px; border-radius:14px; border:1px solid var(--line); background:var(--card);
  color:var(--ink); font-family:inherit; outline:none;
}
#gateInput:focus{ border-color:var(--gold); }
#gateForm button{
  padding:11px 30px; border:none; border-radius:999px; cursor:pointer;
  background:linear-gradient(160deg,var(--rose),var(--rose-d)); color:#fff;
  font-family:inherit; font-weight:700; font-size:13px; box-shadow:0 8px 20px rgba(185,107,118,.35);
}
#gateError{ font-size:11.5px; color:var(--rose-d); min-height:14px; }

header{ text-align:center; padding:calc(16px + env(safe-area-inset-top)) 16px 4px; }
header .title{font-weight:700; font-size:16px; letter-spacing:.02em}
header .sub{font-size:11px; color:var(--sub); margin-top:2px; font-family:"Cormorant Garamond",serif; font-style:italic; letter-spacing:.05em}

/* ===== カバーアート ===== */
.cover-zone{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:16px; padding:6px 30px; min-height:0;
}
.cover-wrap{ position:relative; width:200px; height:200px; flex:0 0 auto; }
.cover-ring{
  position:absolute; inset:-10px; border-radius:50%;
  border:1px solid rgba(201,151,79,.25);
  animation:ring-spin 40s linear infinite;
}
.cover-ring::before, .cover-ring::after{
  content:""; position:absolute; width:5px; height:5px; border-radius:50%;
  background:var(--gold); top:-2.5px; left:50%; margin-left:-2.5px; box-shadow:0 0 8px var(--gold);
}
.cover-ring::after{ top:auto; bottom:-2.5px; background:var(--rose); box-shadow:0 0 8px var(--rose); }
@keyframes ring-spin{ to{ transform:rotate(360deg); } }
.cover{
  width:200px; height:200px; border-radius:50%; object-fit:cover;
  box-shadow:0 0 40px rgba(217,138,148,.4), inset 0 8px 20px rgba(255,255,255,.35);
  transform:scale(1); transition:transform .18s ease-out;
}

.tracktitle{ text-align:center; }
.tracktitle .name{ font-size:15px; font-weight:700; line-height:1.5; }
.tracktitle .desc{ font-size:11.5px; color:var(--sub); margin-top:3px; }

/* ===== トラックリスト ===== */
.tracklist{ display:flex; flex-direction:column; gap:6px; width:100%; }
.trackrow{
  display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:14px;
  border:1px solid var(--line); background:var(--card); cursor:pointer;
}
.trackrow.active{ border-color:var(--gold); background:linear-gradient(90deg,#fff,#fdf1e8); box-shadow:var(--shadow); }
.trackrow .num{ font-size:16px; flex:0 0 auto; }
.trackrow .meta{ flex:1; min-width:0; }
.trackrow .meta .t{ font-size:12.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.trackrow .meta .d{ font-size:10.5px; color:var(--sub); }
.trackrow .dur{ font-size:10.5px; color:var(--sub); flex:0 0 auto; }

/* ===== コントロールカード ===== */
.controls{
  background:var(--card); border-radius:26px 26px 0 0; box-shadow:0 -6px 24px rgba(150,100,90,.10);
  padding:14px 22px calc(16px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:12px; flex:0 0 auto;
}
.seekrow{ display:flex; align-items:center; gap:8px; }
.time{ font-size:10.5px; color:var(--sub); width:34px; flex:0 0 auto; }
.time.right{ text-align:right; }
input[type=range]{ flex:1; -webkit-appearance:none; height:4px; border-radius:2px; background:var(--line); outline:none; }
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
  background:var(--gold); box-shadow:0 2px 6px rgba(0,0,0,.2); cursor:pointer;
}

.playrow{ display:flex; align-items:center; justify-content:center; gap:24px; }
.iconbtn{
  border:none; background:none; color:var(--sub); font-size:19px; cursor:pointer;
  width:40px; height:40px; display:flex; align-items:center; justify-content:center;
}
#playBtn{
  width:62px; height:62px; border-radius:50%; border:none; cursor:pointer;
  background:linear-gradient(160deg,var(--rose),var(--rose-d));
  color:#fff; font-size:22px; box-shadow:0 8px 20px rgba(185,107,118,.45);
  display:flex; align-items:center; justify-content:center;
}
#playBtn:active{ transform:scale(.96); }

.row{ display:flex; align-items:center; gap:10px; }
.row label{ font-size:11px; color:var(--sub); width:44px; flex:0 0 auto; }

.optrow{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.switch{
  display:flex; align-items:center; gap:6px; font-size:11px; color:var(--sub); cursor:pointer;
}
.switch input{ accent-color:var(--gold); width:16px; height:16px; }

.timers{ display:flex; gap:6px; }
.t-btn{
  flex:1; border:1px solid var(--line); background:#fff; border-radius:10px;
  padding:6px 2px; font-size:11px; color:var(--sub); font-family:inherit; cursor:pointer;
}
.t-btn.active{ background:var(--gold); border-color:var(--gold); color:#fff; font-weight:700; }

.status{ text-align:center; font-size:10.5px; color:var(--sub); min-height:13px; }
/* 端末に置いた音源の取り込みパネル */
.localpanel{margin:22px auto 0;max-width:520px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.localpanel summary{cursor:pointer;color:var(--sub);font-size:13px;font-weight:700;list-style:none}
.localpanel summary::-webkit-details-marker{display:none}
.localpanel summary::before{content:"＋ ";color:var(--rose)}
.localpanel[open] summary::before{content:"− "}
.lnote{color:var(--sub);font-size:12px;line-height:1.75;margin:10px 0 12px}
.lrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.lname{flex:1;font-size:13px;color:var(--ink);line-height:1.4}
.lstate{font-size:11px;color:var(--sub);white-space:nowrap}
.lstate.on{color:var(--gold-d);font-weight:700}
.lbtn{padding:5px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font-family:inherit;font-size:12px;cursor:pointer}
.lbtn.del{color:var(--rose-d)}
.lmsg{font-size:12px;color:var(--gold-d);min-height:17px;margin-top:10px;text-align:center}
</style>
</head>
<body>

<div id="gate">
  <div class="icon">🔒</div>
  <div class="gtitle">合言葉を入力してください</div>
  <div class="gsub">Bloom<br>counseling CD</div>
  <form id="gateForm">
    <input id="gateInput" type="password" inputmode="text" autocomplete="off" placeholder="合言葉">
    <button type="submit">入る</button>
  </form>
  <div id="gateError"></div>
</div>

<div id="app">

  <header>
    <div class="sub">— counseling CD —</div>
  </header>

  <div class="cover-zone">
    <div class="cover-wrap">
      <div class="cover-ring"></div>
      <img class="cover" id="cover" src="" alt="Bloom" style="background:var(--bg2)">
    </div>
    <div class="tracktitle">
      <div class="name" id="trackName"></div>
      <div class="desc" id="trackDesc"></div>
    </div>
    <div class="tracklist" id="tracklist"></div>
  </div>

  <div class="controls">
    <div class="seekrow">
      <span class="time" id="curTime">0:00</span>
      <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
      <span class="time right" id="durTime">0:00</span>
    </div>

    <div class="playrow">
      <button class="iconbtn" id="prevBtn" title="前のトラック">❮❮</button>
      <button id="playBtn">▶</button>
      <button class="iconbtn" id="nextBtn" title="次のトラック">❯❯</button>
    </div>

    <div class="row">
      <label>音量</label>
      <input type="range" id="volume" min="0" max="100" value="70">
    </div>

    <div class="optrow">
      <label class="switch"><input type="checkbox" id="autoNext" checked>連続再生（続けて流す）</label>
    </div>

    <div class="timers" id="timers">
      <button class="t-btn" data-min="5">5分</button>
      <button class="t-btn" data-min="10">10分</button>
      <button class="t-btn" data-min="15">15分</button>
      <button class="t-btn" data-min="30">30分</button>
      <button class="t-btn active" data-min="0">タイマーなし</button>
    </div>

    <div class="status" id="status">タップして再生</div>
  </div>


  <details class="localpanel">
    <summary>音源を端末に置く</summary>
    <p class="lnote">音源はアプリには入っていません。ここで選ぶと<b>この端末の中だけ</b>に保存され、オフラインでも鳴るようになります。アプリを公開しても、音源が誰かに渡ることはありません。<br>PCの音源フォルダからスマホへファイルを移してから、下の「選ぶ」で指定してください。</p>
    <div id="localSlots"></div>
    <input type="file" id="slotFile" style="display:none">
    <div class="lmsg" id="localMsg"></div>
  </details>
</div>

<script>
/* ===== 合言葉ゲート =====
   本格的なセキュリティではなく「知らない人には開けない」ための簡易ゲート。
   合言葉を変えたい場合：ブラウザのコンソールで
     await crypto.subtle.digest("SHA-256", new TextEncoder().encode("新しい合言葉"))
       .then(b => [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""))
   を実行して出てきた文字列を GATE_HASH に貼り替える。デフォルトの合言葉は「2026」。
*/
const GATE_HASH = "158a323a7ba44870f23d96f1516dd70aa48e9a72db4ebb026b0a89e212a208ab";
const GATE_KEY = "miryoku_gate_ok";

async function sha256Hex(str){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}

function openApp(){
  document.getElementById("gate").classList.add("hide");
  document.getElementById("app").classList.add("show");
}

(function initGate(){
  if(localStorage.getItem(GATE_KEY) === "1"){ openApp(); return; }
  document.getElementById("gateForm").addEventListener("submit", async (e)=>{
    e.preventDefault();
    const input = document.getElementById("gateInput");
    const hash = await sha256Hex(input.value.trim());
    if(hash === GATE_HASH){
      localStorage.setItem(GATE_KEY, "1");
      openApp();
    } else {
      document.getElementById("gateError").textContent = "合言葉が違います";
      input.value = "";
      input.focus();
    }
  });
})();

const TRACKS = [
  { file:"audio/01-counseling.mp3", num:"①", name:"カウンセリング",                       desc:"導入" },
  { file:"audio/02-relax.mp3",      num:"②", name:"リラクゼーション",                     desc:"深いリラックスへ" },
  { file:"audio/03-imaging.mp3",    num:"③", name:"イメージング",                         desc:"" },
  { file:"audio/04-chanmina.mp3",   num:"④", name:"ちゃんみな",                             desc:"" },
  { file:"audio/05-chanting.mp3",   num:"⑤", name:"サイババアシュラム",                     desc:"" },
  { file:"audio/06-imaging-kareshi.mp3", num:"⑥", name:"イメージング（となりにいる）", desc:"寝る前用・自分の声" },
  { file:"audio/07-surrender.mp3",  num:"⑦", name:"手放し・明け渡し",                   desc:"誘導瞑想・7分37秒" },
];

/* ===== 端末に置いた音源で鳴らす =====
   ①〜⑤は市販の音源、⑦は他人の配信からの切り出し。アプリ本体に同梱すると
   公開した瞬間に「配った」ことになるので、音源はアプリに1バイトも入れない。
   端末のIndexedDBにだけ置いて、この端末の中で鳴らす。
   取り込んでいない曲は、同じフォルダに audio/ があればそれで鳴る（PCで開いたとき用）。 */
const BDB='bloomAudio';
function bdb(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(BDB,1);
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains('files')) r.result.createObjectStore('files'); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
async function bPut(key,blob){
  const db=await bdb();
  return new Promise((res,rej)=>{
    const t=db.transaction('files','readwrite'); t.objectStore('files').put(blob,key);
    t.oncomplete=()=>res(true); t.onerror=()=>rej(t.error);
  });
}
async function bGet(key){
  try{
    const db=await bdb();
    return await new Promise(res=>{
      const t=db.transaction('files','readonly'); const q=t.objectStore('files').get(key);
      q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null);
    });
  }catch(e){ return null; }
}
async function bDel(key){
  try{ const db=await bdb();
    await new Promise(res=>{ const t=db.transaction('files','readwrite'); t.objectStore('files').delete(key); t.oncomplete=res; t.onerror=res; });
  }catch(e){}
}
/* 取り込み済みかを画面に出すためだけの控え。実体はIndexedDBにある */
const BHAVE='bloomHave';
function bHave(k){ try{ return (JSON.parse(localStorage.getItem(BHAVE)||'{}'))[k]||null; }catch(e){ return null; } }
function bHaveSet(k,v){
  let o={}; try{ o=JSON.parse(localStorage.getItem(BHAVE)||'{}'); }catch(e){}
  if(v) o[k]=v; else delete o[k];
  try{ localStorage.setItem(BHAVE,JSON.stringify(o)); }catch(e){}
}
const tkey = t => t.file.replace(/^audio\//,'').replace(/\.mp3$/i,'');
let curObjUrl=null;
async function setTrackSrc(t){
  if(curObjUrl){ try{ URL.revokeObjectURL(curObjUrl); }catch(e){} curObjUrl=null; }
  const blob=await bGet(tkey(t));
  if(blob){ curObjUrl=URL.createObjectURL(blob); player.src=curObjUrl; }
  else { player.src=t.file; }
}

const player = document.getElementById("player") || new Audio();
player.preload = "metadata";

const coverEl = document.getElementById("cover");
const trackNameEl = document.getElementById("trackName");
const trackDescEl = document.getElementById("trackDesc");
const tracklistEl = document.getElementById("tracklist");
const playBtn = document.getElementById("playBtn");
const seekEl = document.getElementById("seek");
const curTimeEl = document.getElementById("curTime");
const durTimeEl = document.getElementById("durTime");

/* カバー画像も端末から。既定の cover.png は他社のキャラクター画像なので公開物に含めない。 */
const COVER_KEY='__cover';
async function applyLocalCover(){
  const blob=await bGet(COVER_KEY);
  if(blob){ coverEl.src=URL.createObjectURL(blob); }
}
const volumeEl = document.getElementById("volume");
const autoNextEl = document.getElementById("autoNext");
const timersEl = document.getElementById("timers");
const statusEl = document.getElementById("status");

let trackIndex = 0;
let timerMinutes = 0;
let timerDeadline = null;
let audioCtx = null, analyser = null, sourceNode = null;
let isSeeking = false;

player.volume = volumeEl.value / 100;

function fmt(sec){
  if(!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec/60), s = Math.floor(sec%60);
  return `${m}:${String(s).padStart(2,"0")}`;
}

function renderTracklist(){
  tracklistEl.innerHTML = "";
  TRACKS.forEach((t,i)=>{
    const row = document.createElement("div");
    row.className = "trackrow" + (i===trackIndex ? " active" : "");
    row.innerHTML = `<span class="num">${t.num}</span>
      <span class="meta"><div class="t">${t.name}</div><div class="d">${t.desc}</div></span>
      <span class="dur" data-dur="${i}">--:--</span>`;
    row.onclick = () => loadTrack(i, true);
    tracklistEl.appendChild(row);
  });
}

function updateTrackInfo(){
  const t = TRACKS[trackIndex];
  trackNameEl.textContent = t.name;
  trackDescEl.textContent = t.desc;
  [...tracklistEl.children].forEach((el,i)=> el.classList.toggle("active", i===trackIndex));
}

async function loadTrack(i, autoplay){
  trackIndex = ((i % TRACKS.length) + TRACKS.length) % TRACKS.length;
  await setTrackSrc(TRACKS[trackIndex]);
  updateTrackInfo();
  if(autoplay) play();
}

function ensureAudioGraph(){
  if(audioCtx) return;
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  sourceNode = audioCtx.createMediaElementSource(player);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  sourceNode.connect(analyser);
  analyser.connect(audioCtx.destination);
}

async function play(){
  const t = TRACKS[trackIndex];
  /* 端末に取り込んでいない曲は鳴らない（音源はアプリに入っていないため）。
     黙って失敗すると壊れたように見えるので、理由を出して取り込みパネルを開く。 */
  if(!(await bGet(tkey(t)))){
    statusEl.textContent = `${t.num} ${t.name} は、まだこの端末に入っていません`;
    const panel = document.querySelector(".localpanel");
    if(panel){
      panel.open = true;
      panel.scrollIntoView({behavior:"smooth", block:"center"});
      const msg = document.getElementById("localMsg");
      if(msg) msg.textContent = "下の「選ぶ」から、この曲の音源を取り込んでください。";
    }
    return;
  }
  ensureAudioGraph();
  if(audioCtx.state === "suspended") await audioCtx.resume();
  try{
    await player.play();
  }catch(e){
    statusEl.textContent = "再生できませんでした。音源を入れ直してみてください";
    return;
  }
  playBtn.textContent = "❚❚";
  statusEl.textContent = "再生中";
  if(timerMinutes>0 && !timerDeadline) timerDeadline = Date.now() + timerMinutes*60000;
  pulseLoop();
}

function pause(){
  player.pause();
  playBtn.textContent = "▶";
  statusEl.textContent = "一時停止中";
  coverEl.style.transform = "scale(1)";
}

playBtn.addEventListener("click", ()=>{
  if(player.paused) play(); else pause();
});
document.getElementById("prevBtn").addEventListener("click", ()=> loadTrack(trackIndex-1, !player.paused));
document.getElementById("nextBtn").addEventListener("click", ()=> loadTrack(trackIndex+1, !player.paused));

player.addEventListener("loadedmetadata", ()=>{
  seekEl.max = player.duration || 0;
  durTimeEl.textContent = fmt(player.duration);
  const durEl = tracklistEl.querySelector(`[data-dur="${trackIndex}"]`);
  if(durEl) durEl.textContent = fmt(player.duration);
});
player.addEventListener("timeupdate", ()=>{
  if(isSeeking) return;
  seekEl.value = player.currentTime;
  curTimeEl.textContent = fmt(player.currentTime);
});
player.addEventListener("ended", ()=>{
  if(autoNextEl.checked && trackIndex < TRACKS.length-1){
    loadTrack(trackIndex+1, true);
  } else {
    playBtn.textContent = "▶";
    statusEl.textContent = "再生終了 — おつかれさま";
    coverEl.style.transform = "scale(1)";
  }
});

seekEl.addEventListener("input", ()=>{ isSeeking = true; curTimeEl.textContent = fmt(seekEl.value); });
seekEl.addEventListener("change", ()=>{ player.currentTime = Number(seekEl.value); isSeeking = false; });

volumeEl.addEventListener("input", ()=>{ player.volume = volumeEl.value/100; });

timersEl.addEventListener("click", (e)=>{
  const btn = e.target.closest(".t-btn");
  if(!btn) return;
  [...timersEl.children].forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  timerMinutes = Number(btn.dataset.min);
  timerDeadline = (timerMinutes>0 && !player.paused) ? Date.now()+timerMinutes*60000 : null;
});

function pulseLoop(){
  if(player.paused){ return; }
  if(analyser){
    const arr = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(arr);
    let sum=0; for(const v of arr) sum+=v;
    const lvl = sum/arr.length/255;
    coverEl.style.transform = `scale(${1 + lvl*0.06})`;
  }
  requestAnimationFrame(pulseLoop);
}

setInterval(()=>{
  if(timerMinutes>0 && timerDeadline){
    const remain = timerDeadline - Date.now();
    if(remain<=0){
      pause();
      statusEl.textContent = "タイマー終了 — おつかれさま";
      timerDeadline = null;
      return;
    }
    if(!player.paused) statusEl.textContent = `再生中 — 残り ${fmt(remain/1000)}`;
  }
}, 1000);

renderTracklist();
loadTrack(0, false);

if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

/* ===== 音源の取り込みUI ===== */
(function(){
  const slots=document.getElementById("localSlots");
  const filePick=document.getElementById("slotFile");
  const msg=document.getElementById("localMsg");
  let pendingKey=null;
  const tell=t=>{ msg.textContent=t; };
  const EXTRA=[{num:"■",name:"カバー画像",key:COVER_KEY}];
  function render(){
    slots.innerHTML="";
    TRACKS.concat(EXTRA).forEach(t=>{
      const k=t.key||tkey(t), have=bHave(k);
      const row=document.createElement("div"); row.className="lrow";
      row.innerHTML=`<div class="lname">${t.num} ${t.name}</div>
        <div class="lstate${have?' on':''}">${have?'取り込み済み':'未取り込み'}</div>`;
      const pick=document.createElement("button");
      pick.className="lbtn"; pick.textContent=have?"入れ直す":"選ぶ";
      pick.onclick=()=>{ pendingKey=k; filePick.value=""; filePick.accept="*/*"; filePick.click(); };
      row.appendChild(pick);
      if(have){
        const del=document.createElement("button");
        del.className="lbtn del"; del.textContent="消す";
        del.onclick=async()=>{
          if(!confirm(`${t.name} の音源を、この端末から消します。よろしいですか？`)) return;
          await bDel(k); bHaveSet(k,null); render(); tell(`${t.name} を消しました。`);
        };
        row.appendChild(del);
      }
      slots.appendChild(row);
    });
  }
  filePick.onchange=async()=>{
    const f=filePick.files&&filePick.files[0];
    if(!f||!pendingKey) return;
    tell("取り込んでいます…");
    try{
      if(!f.size){ tell(`「${f.name}」は中身が空でした。スマホへの転送が途中で終わっている可能性があります。`); pendingKey=null; return; }
      const head=await f.slice(0,4).arrayBuffer();          // 実際に読めるか確かめる
      if(!head||head.byteLength===0){ tell(`「${f.name}」を読み取れませんでした。いったん端末内（ダウンロード）にコピーしてから選んでください。`); pendingKey=null; return; }
      await bPut(pendingKey,f);
      bHaveSet(pendingKey,f.name);
      render();
      tell(`取り込みました（${(f.size/1048576).toFixed(1)}MB）。この端末の中だけに入っています。`);
      const cur=TRACKS[trackIndex];
      if(pendingKey===COVER_KEY) await applyLocalCover();
      else if(tkey(cur)===pendingKey) await setTrackSrc(cur);
    }catch(e){
      tell(`取り込めませんでした（${e&&e.name?e.name:"不明なエラー"}）。空き容量か、ファイルの置き場所を確認してください。`);
    }
    pendingKey=null;
  };
  render(); applyLocalCover();
  /* 1曲も入っていない＝初回。案内が目に入るようにパネルを開いておく */
  if(!TRACKS.some(t=>bHave(tkey(t)))){
    document.querySelector(".localpanel").open=true;
    tell("まだ音源が入っていません。各行の「選ぶ」から取り込んでください。");
  }
})();
</script>
</body>
